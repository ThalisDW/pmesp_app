services:
  mongo:
    image: mongo:7
    container_name: pmesp_mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-pmesp2024}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-pmesp}
    volumes:
      - mongo_data:/data/db
    networks:
      - pmesp_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pmesp_backend
    restart: unless-stopped
    environment:
      PORT: 4000
      NUXT_MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-pmesp2024}@mongo:27017/${MONGO_DB:-pmesp}?authSource=admin
      NUXT_JWT_SECRET: ${JWT_SECRET:-pmesp_jwt_secret_change_in_production}
      NODE_ENV: production
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    networks:
      - pmesp_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: pmesp_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - pmesp_network

volumes:
  mongo_data:
    driver: local

networks:
  pmesp_network:
    driver: bridge
